name: laravel-ecommerce

# -----------------------------------------------------------------------------
#  Local ports
#     http://localhost:6180  -> web application (nginx -> php-fpm)
#     http://localhost:6181  -> Adminer (database GUI)
#     localhost:6182         -> MySQL (for TablePlus / DBeaver / CLI clients)
# -----------------------------------------------------------------------------

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    container_name: shop_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - .:/var/www/html
      - composer_cache:/root/.composer/cache
    environment:
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: laravel_ecommerce
      DB_USERNAME: shop
      DB_PASSWORD: secret
      AUTO_SEED: "true"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - shop

  web:
    image: nginx:1.27-alpine
    container_name: shop_web
    restart: unless-stopped
    ports:
      - "6180:80"
    volumes:
      - .:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    networks:
      - shop

  mysql:
    image: mysql:8.0
    container_name: shop_mysql
    restart: unless-stopped
    ports:
      - "6182:3306"
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: laravel_ecommerce
      MYSQL_USER: shop
      MYSQL_PASSWORD: secret
    command: --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -proot --silent"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 20s
    networks:
      - shop

  adminer:
    image: adminer:4
    container_name: shop_adminer
    restart: unless-stopped
    ports:
      - "6181:8080"
    environment:
      ADMINER_DEFAULT_SERVER: mysql
      ADMINER_DESIGN: pepa-linha
    depends_on:
      - mysql
    networks:
      - shop

volumes:
  mysql_data:
  composer_cache:

networks:
  shop:
    driver: bridge
