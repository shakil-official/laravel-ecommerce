; Application level PHP settings
memory_limit = 256M
upload_max_filesize = 10M
post_max_size = 12M
max_execution_time = 60
date.timezone = Asia/Dhaka
expose_php = Off

; OPcache (revalidate often so bind-mounted code edits show up immediately)
opcache.enable = 1
opcache.validate_timestamps = 1
opcache.revalidate_freq = 1
